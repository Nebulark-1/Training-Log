<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaos Coaching</title>
<meta name="description" content="Chaos Coaching — a training log with a coach in it.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128211;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- sign-in ------------------------------------------------------------- -->
<div class="shell" id="gate" hidden>
  <div class="gate">
    <p class="gate-brand">Chaos<em>Coaching</em></p>
    <h1>A training log with a coach in it.</h1>
    <p class="gate-lead">Your sessions from Strava, a strength program that holds its shape, and
    a coach that reads your notes before it plans your week.</p>
    <div class="gate-actions" id="gateActions"></div>
    <p class="sig" id="gateNote"></p>
  </div>
</div>

<!-- app ----------------------------------------------------------------- -->
<div id="shell" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <a class="wordmark" href="/training" data-link>
        <span class="wm-name">Chaos<em>Coaching</em></span>
      </a>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="topbar-right">
        <div class="syncbar" id="syncbar"></div>
        <div class="who" id="who"></div>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <div class="foot-in">
      <span>Chaos Coaching</span>
    </div>
  </footer>
</div>

<div class="sheet" id="sheet" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
