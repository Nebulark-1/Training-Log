<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volume Ledger</title>
<meta name="description" content="Training log that syncs Strava, programs strength, and plans each week with Claude.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128211;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- sign-in ------------------------------------------------------------- -->
<div class="shell" id="gate" hidden>
  <div class="gate">
    <p class="eyebrow">Training ledger</p>
    <h1>Volume Ledger</h1>
    <p>Your Strava data, a strength program that holds its shape, and a coach that
    reads your own notes before it tells you what to do. Everything stays on this machine.</p>
    <div class="btnrow" id="gateActions"></div>
    <p class="sig" id="gateNote"></p>
  </div>
</div>

<!-- app ----------------------------------------------------------------- -->
<div id="shell" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <a class="wordmark" href="/today" data-link>
        <span class="wm-eyebrow">Training ledger</span>
        <span class="wm-name">Volume Ledger</span>
      </a>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="topbar-right">
        <div class="syncbar" id="syncbar"></div>
        <div class="who" id="who"></div>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <div class="foot-in">
      <span>Volume Ledger &mdash; running on this machine</span>
      <span class="foot-links">
        <a href="/settings" data-link>Settings</a>
        <a href="/api/export">Export everything</a>
      </span>
    </div>
  </footer>
</div>

<div class="sheet" id="sheet" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
